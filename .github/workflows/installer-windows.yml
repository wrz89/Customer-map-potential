name: Installer Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'desktop/**', 'server/**', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/installer-windows.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npx vitest run
      - name: Crea installatore e versione portatile
        run: npm run installer
      - name: Installa in modo silenzioso
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Customer-Map-Potential-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Customer Map Potential.exe' | Select-Object -First 1 | ForEach-Object { "EXE=$($_.FullName)" | Out-File $env:GITHUB_ENV -Append }
      - name: Avvia l'app installata e controlla
        shell: pwsh
        run: |
          if (-not $env:EXE) { throw "Programma installato non trovato" }
          $esito = "$env:RUNNER_TEMP\esito.json"
          Start-Process -FilePath $env:EXE -ArgumentList "--prova-avvio=$esito" -Wait
          Get-Content $esito
          $j = Get-Content $esito | ConvertFrom-Json
          if ($j.errore) { throw "Errore nella pagina: $($j.errore)" }
          if (-not $j.datiComuni) { throw "Dati dei comuni non caricati" }
          if (-not $j.abitanti) { throw "Indicatori non calcolati" }
          if (-not $j.api.demo) { throw "API locale non risponde come previsto" }
          Write-Host "Avvio verificato: $($j.dealer)"
      - uses: actions/upload-artifact@v4
        with:
          name: Customer-Map-Potential-Windows
          path: |
            release/Customer-Map-Potential-Setup-*.exe
            release/Customer-Map-Potential-Portable-*.exe
          retention-days: 30

      # Su main: release scaricabile, con nomi fissi così il link "latest" non cambia mai
      - name: Prepara i file della release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSIONE=$v" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force pubblica, zip | Out-Null
          Copy-Item (Get-ChildItem release -Filter 'Customer-Map-Potential-Portable-*.exe')[0].FullName 'zip\Customer-Map-Potential-Portable.exe'
          Copy-Item desktop\LEGGIMI.txt zip\LEGGIMI.txt
          Compress-Archive -Path zip\* -DestinationPath pubblica\Customer-Map-Potential-Windows.zip
          Copy-Item (Get-ChildItem release -Filter 'Customer-Map-Potential-Setup-*.exe')[0].FullName 'pubblica\Customer-Map-Potential-Setup.exe'
          Get-ChildItem pubblica
      - name: Pubblica la release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIONE }}
          name: Customer Map Potential ${{ env.VERSIONE }}
          make_latest: true
          body: |
            **Scarica `Customer-Map-Potential-Windows.zip`**, estrailo e fai doppio clic su `Customer-Map-Potential-Portable.exe`. Non serve installare nulla.

            In alternativa `Customer-Map-Potential-Setup.exe` installa il programma con icona sul desktop e nel menu Start.

            Al primo avvio Windows può mostrare "Windows ha protetto il PC": clic su "Ulteriori informazioni", poi "Esegui comunque".

            Versione installata e avviata automaticamente su Windows prima della pubblicazione.
          files: |
            pubblica/Customer-Map-Potential-Windows.zip
            pubblica/Customer-Map-Potential-Setup.exe
