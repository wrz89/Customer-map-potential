name: Installer Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'desktop/**', 'server/**', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/installer-windows.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npx vitest run
      # Ogni build ha una versione nuova (1.0.<numero build>): è ciò che fa scattare l'aggiornamento automatico
      - name: Numero di versione
        shell: pwsh
        run: |
          $base = ((Get-Content package.json | ConvertFrom-Json).version -split '\.')[0..1] -join '.'
          $v = "$base.${{ github.run_number }}"
          npm version $v --no-git-tag-version --allow-same-version | Out-Null
          "VERSIONE=$v" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Versione $v"
      - name: Crea installatore e versione portatile
        run: npm run installer
      - name: Installa in modo silenzioso
        shell: pwsh
        run: |
          $setup = Get-Item release\Customer-Map-Potential-Setup.exe
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Customer Map Potential.exe' | Select-Object -First 1 | ForEach-Object { "EXE=$($_.FullName)" | Out-File $env:GITHUB_ENV -Append }
      - name: Avvia l'app installata e controlla
        shell: pwsh
        run: |
          if (-not $env:EXE) { throw "Programma installato non trovato" }
          $esito = "$env:RUNNER_TEMP\esito.json"
          Start-Process -FilePath $env:EXE -ArgumentList "--prova-avvio=$esito" -Wait
          Get-Content $esito
          $j = Get-Content $esito | ConvertFrom-Json
          if ($j.errore) { throw "Errore nella pagina: $($j.errore)" }
          if (-not $j.datiComuni) { throw "Dati dei comuni non caricati" }
          if (-not $j.abitanti) { throw "Indicatori non calcolati" }
          if (-not $j.api.demo) { throw "API locale non risponde come previsto" }
          Write-Host "Avvio verificato: $($j.dealer)"
      - uses: actions/upload-artifact@v4
        with:
          name: Customer-Map-Potential-Windows
          path: |
            release/Customer-Map-Potential-Setup.exe
            release/Customer-Map-Potential-Portable.exe
            release/latest.yml
          retention-days: 30

      # Su main: release scaricabile, con nomi fissi così il link "latest" non cambia mai.
      # latest.yml + blockmap servono al programma installato, il .exe portatile al programma portatile.
      - name: Prepara i file della release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force pubblica, zip, precedente | Out-Null
          Copy-Item release\Customer-Map-Potential-Portable.exe zip\
          Copy-Item desktop\LEGGIMI.txt zip\LEGGIMI.txt
          Compress-Archive -Path zip\* -DestinationPath pubblica\Customer-Map-Potential-Windows.zip
          Copy-Item release\Customer-Map-Potential-Setup.exe, release\Customer-Map-Potential-Setup.exe.blockmap, release\latest.yml, release\Customer-Map-Potential-Portable.exe pubblica\
          Get-ChildItem pubblica
          # versione precedente (l'attuale "latest", prima di pubblicare questa), per provare l'aggiornamento vero
          $prec = gh release view --repo ${{ github.repository }} --json tagName -q .tagName
          Write-Host "Versione precedente: $prec"
          gh release download $prec --repo ${{ github.repository }} -D precedente -p latest.yml -p Customer-Map-Potential-Setup.exe -p Customer-Map-Potential-Portable.exe
          $global:LASTEXITCODE = 0  # una versione vecchia senza questi file non deve bloccare la pubblicazione
          if ((Test-Path precedente\latest.yml) -and (Test-Path precedente\Customer-Map-Potential-Portable.exe)) {
            "PROVA_AGGIORNAMENTO=1" | Out-File $env:GITHUB_ENV -Append
          } else {
            Write-Host "La versione $prec non ha l'aggiornamento automatico: prova saltata"
          }
      - name: Pubblica la release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIONE }}
          name: Customer Map Potential ${{ env.VERSIONE }}
          make_latest: true
          body: |
            **Scarica `Customer-Map-Potential-Windows.zip`**, estrailo e fai doppio clic su `Customer-Map-Potential-Portable.exe`. Non serve installare nulla.

            In alternativa `Customer-Map-Potential-Setup.exe` installa il programma con icona sul desktop e nel menu Start.

            Il programma si aggiorna da solo: all'avvio controlla questa pagina, scarica la versione nuova e la installa al riavvio.

            Al primo avvio Windows può mostrare "Windows ha protetto il PC": clic su "Ulteriori informazioni", poi "Esegui comunque".

            Versione installata e avviata automaticamente su Windows prima della pubblicazione.
          files: |
            pubblica/Customer-Map-Potential-Windows.zip
            pubblica/Customer-Map-Potential-Setup.exe
            pubblica/Customer-Map-Potential-Setup.exe.blockmap
            pubblica/Customer-Map-Potential-Portable.exe
            pubblica/latest.yml

      # Prova reale: la versione precedente, installata e portatile, deve aggiornarsi a questa
      - name: Prova l'aggiornamento automatico
        if: github.ref == 'refs/heads/main' && env.PROVA_AGGIORNAMENTO == '1'
        shell: pwsh
        run: |
          function Attendi-Versione($exe) {
            $atteso = '^' + [regex]::Escape($env:VERSIONE) + '(\.0)?$'
            for ($i = 0; $i -lt 90; $i++) {
              if ((Test-Path $exe) -and (Get-Item $exe).VersionInfo.ProductVersion -match $atteso) { return $true }
              Start-Sleep 2
            }
            Write-Host "Versione trovata: $((Get-Item $exe).VersionInfo.ProductVersion)"
            return $false
          }
          # diagnosi: gli indirizzi letti dalle versioni installate
          foreach ($u in @(
            'https://github.com/${{ github.repository }}/releases.atom',
            'https://github.com/wrz89/customer-map-potential/releases.atom',
            'https://github.com/${{ github.repository }}/releases/latest/download/latest.yml')) {
            try { $r = Invoke-WebRequest $u -UseBasicParsing; Write-Host "$($r.StatusCode) $u" } catch { Write-Host "ERRORE $u : $($_.Exception.Message)" }
          }
          $cartella = Split-Path $env:EXE
          Start-Process -FilePath (Join-Path $cartella 'Uninstall Customer Map Potential.exe') -ArgumentList '/S' -Wait
          Start-Sleep 5
          Start-Process -FilePath precedente\Customer-Map-Potential-Setup.exe -ArgumentList '/S' -Wait
          Write-Host "Installata la precedente: $((Get-Item $env:EXE).VersionInfo.ProductVersion)"
          $esito = "$env:RUNNER_TEMP\agg-installato.json"
          Start-Process -FilePath $env:EXE -ArgumentList "--prova-aggiornamento=$esito" -Wait
          Get-Content $esito
          if ((Get-Content $esito | ConvertFrom-Json).fase -ne 'pronto') { throw "Programma installato: aggiornamento non scaricato" }
          if (-not (Attendi-Versione $env:EXE)) { throw "Programma installato: non è passato a $env:VERSIONE" }
          Write-Host "Programma installato aggiornato a $env:VERSIONE"

          $port = (Resolve-Path precedente\Customer-Map-Potential-Portable.exe).Path
          $esito = "$env:RUNNER_TEMP\agg-portatile.json"
          Start-Process -FilePath $port -ArgumentList "--prova-aggiornamento=$esito" -Wait
          Get-Content $esito
          if ((Get-Content $esito | ConvertFrom-Json).fase -ne 'pronto') { throw "Programma portatile: aggiornamento non scaricato" }
          if (-not (Attendi-Versione $port)) { throw "Programma portatile: non è passato a $env:VERSIONE" }
          Write-Host "Programma portatile aggiornato a $env:VERSIONE"
